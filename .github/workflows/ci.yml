name: Offline Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test without deployed datasets
        run: python -m pytest tests/ -v
      - name: Lint
        run: |
          if ! ruff check --output-format github; then
            {
              echo '### Ruff findings'
              echo '```text'
              ruff check --output-format concise || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
